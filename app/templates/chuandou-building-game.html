<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>穿斗营造 - 穿斗式建筑</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1810 100%);
            font-family: "Microsoft YaHei", "Noto Serif SC", serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
            display: flex;
        }
        #leftPanel {
            width: 190px;
            background: linear-gradient(180deg, #13171d 0%, #0d1015 100%);
            border-right: 1px solid rgba(196, 165, 116, 0.35);
            padding: clamp(8px, 1.2vh, 14px) 10px;
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 0.7vh, 8px);
            z-index: 10;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            height: 100vh;
            overflow-y: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #leftPanel h2 {
            color: #c4a574;
            text-align: center;
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(14px, 1.6vh, 16px);
            margin: 0 0 clamp(4px, 0.8vh, 8px) 0;
            padding-bottom: clamp(4px, 0.6vh, 6px);
            border-bottom: 1px solid rgba(196, 165, 116, 0.2);
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
            letter-spacing: 2px;
        }

        .part-item {
            flex: 1;
            min-height: 20px;
            max-height: 52px;
            padding: 0 10px;
            background: linear-gradient(135deg, rgba(28, 34, 42, 0.88) 0%, rgba(18, 22, 28, 0.94) 100%);
            border: 1px solid rgba(196, 165, 116, 0.25);
            color: #d8dfdb;
            cursor: grab;
            text-align: center;
            border-radius: 4px;
            font-size: clamp(12px, 1.35vh, 14px);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            transition: all 0.25s ease;
            user-select: none;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .part-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(196, 165, 116, 0.2), transparent);
            transition: left 0.5s;
        }

        .part-item:hover::before {
            left: 100%;
        }

        .part-item:hover {
            border-color: rgba(196, 165, 116, 0.65);
            background: linear-gradient(135deg, rgba(38, 46, 58, 0.95) 0%, rgba(24, 30, 38, 0.95) 100%);
            color: #f5ede1;
            transform: translateX(5px);
            box-shadow: 0 0 12px rgba(196, 165, 116, 0.25);
        }

        .part-item.selected {
            border-color: #52c41a !important;
            background: linear-gradient(135deg, rgba(38, 85, 34, 0.95) 0%, rgba(22, 53, 20, 0.95) 100%) !important;
            box-shadow: 0 0 14px rgba(82, 196, 26, 0.65) !important;
            transform: translateX(6px) !important;
            color: #eaff8f !important;
        }

        .part-item.dragging {
            opacity: 0.95;
            background: linear-gradient(135deg, #389e0d 0%, #237804 100%) !important;
            border-color: #73d13d !important;
            color: #ffffff !important;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(82, 196, 26, 0.8) !important;
        }

        .part-item.placed {
            background: linear-gradient(135deg, #233b20 0%, #172715 100%);
            border-color: #389e0d;
            color: #95de64;
            cursor: default;
        }

        .part-item.placed::after {
            content: '✓';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #52c41a;
            font-size: 13px;
            font-weight: bold;
        }
        #scene {
            flex: 1;
            position: relative;
        }
        #title {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #c4a574;
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 600;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
        }
        #tip {
            position: absolute;
            top: 82px !important;
            left: 50%;
            transform: translateX(-50%);
            color: #8c7d6c;
            font-size: 13px;
            z-index: 10;
            background: rgba(20, 14, 10, 0.7);
            padding: 2px 14px;
            border-radius: 10px;
            border: 1px solid rgba(80, 60, 42, 0.35);
        }
        #book {
            position: absolute;
            right: 20px;
            bottom: 75px;
            width: 320px;
            background: rgba(20, 25, 30, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(196, 165, 116, 0.45);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(196, 165, 116, 0.12);
            border-radius: 8px;
            padding: 16px 20px;
            display: none;
            z-index: 20;
            font-family: "Noto Serif SC", serif;
            cursor: pointer;
        }

        #book.show {
            display: block;
            animation: bookSlideIn 0.4s ease;
        }

        @keyframes bookSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #book.success {
            border-left: 4px solid #52c41a;
        }

        #book.error {
            border-left: 4px solid #d9534f;
        }

        #bookTitle {
            color: #c4a574;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #bookQuote {
            color: #d8dfdb;
            font-size: 13px;
            line-height: 1.8;
            padding: 12px;
            background: rgba(196, 165, 116, 0.08);
            border-left: 3px solid rgba(196, 165, 116, 0.6);
            border-radius: 4px;
            font-style: italic;
            margin-bottom: 10px;
        }

        #bookSource {
            color: #a49c90;
            font-size: 11px;
            text-align: right;
            margin-bottom: 12px;
            font-style: italic;
        }

        #bookExp {
            color: #c8cfd6;
            font-size: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(196, 165, 116, 0.25);
            line-height: 1.6;
        }
        #progress {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #c4a574;
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            letter-spacing: 1px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 7px 22px;
            border-radius: 20px;
            border: 1px solid rgba(196, 165, 116, 0.35);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        #progressBar {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 6px;
            background: rgba(18, 22, 28, 0.85);
            border: 1px solid rgba(196, 165, 116, 0.25);
            border-radius: 3px;
            overflow: hidden;
            z-index: 10;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8c734b 0%, #c4a574 50%, #8c734b 100%);
            box-shadow: 0 0 8px rgba(196, 165, 116, 0.5);
            transition: width 0.4s ease;
        }

        #restartBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 18px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(196, 165, 116, 0.35);
            color: #c4a574;
            font-family: 'Noto Serif SC', serif;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            z-index: 10;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        #restartBtn:hover {
            background: rgba(196, 165, 116, 0.25);
            border-color: rgba(196, 165, 116, 0.65);
            color: #f5ede1;
            box-shadow: 0 0 12px rgba(196, 165, 116, 0.3);
            transform: translateY(-1px);
        }

        #complete {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #complete.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #completeContent {
            background: rgba(20, 25, 30, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(196, 165, 116, 0.5);
            max-width: 520px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 25px rgba(196, 165, 116, 0.15);
            font-family: 'Noto Serif SC', serif;
        }

        #completeContent h1 {
            color: #c4a574;
            margin: 0 0 15px 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        #completeContent p {
            color: #d8dfdb;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.8;
        }

        #completeContent button {
            padding: 10px 24px;
            background: rgba(196, 165, 116, 0.2);
            border: 1px solid #c4a574;
            color: #c4a574;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        #completeContent button:hover {
            background: rgba(196, 165, 116, 0.35);
            color: #f5ede1;
            box-shadow: 0 0 15px rgba(196, 165, 116, 0.35);
            transform: translateY(-1px);
        }
        #dragIndicator {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(46, 125, 50, 0.95), rgba(82, 196, 26, 0.95));
            border: 1px solid rgba(160, 240, 140, 0.6);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #helpBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a2b1d, #251b12);
            border: 1.5px solid #6e583c;
            color: #bfa87a;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        #helpBtn:hover {
            transform: scale(1.08);
            background: #463625;
            border-color: #8a724d;
            color: #dfd0b5;
            box-shadow: 0 0 12px rgba(138, 114, 77, 0.3);
        }
        #helpModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #helpModal.show {
            display: flex;
        }

        #helpContent {
            background: rgba(20, 25, 30, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 36px 40px;
            border-radius: 8px;
            border: 1px solid rgba(196, 165, 116, 0.5);
            max-width: 480px;
            width: 90%;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(196, 165, 116, 0.12);
            font-family: 'Noto Serif SC', serif;
        }

        #helpContent h2 {
            color: #c4a574;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(196, 165, 116, 0.25);
            font-size: 20px;
            font-weight: 600;
        }

        #helpContent ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #helpContent li {
            padding: 10px 14px;
            margin-bottom: 9px;
            color: #d8e2ea;
            font-size: 14px;
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(196, 165, 116, 0.15);
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        #helpContent li .label {
            color: #c4a574;
            font-weight: 600;
        }

        #helpContent li:last-child {
            margin-bottom: 0;
        }

        #helpContent .closeHelp {
            margin-top: 24px;
            padding: 11px 24px;
            background: rgba(196, 165, 116, 0.2);
            border: 1px solid #c4a574;
            border-radius: 4px;
            color: #c4a574;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            width: 100%;
            transition: all 0.3s;
        }

        #helpContent .closeHelp:hover {
            background: rgba(196, 165, 116, 0.35);
            color: #f5ede1;
            box-shadow: 0 0 18px rgba(196, 165, 116, 0.35);
            transform: translateY(-1px);
        }
        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .success-animation {
            animation: successPulse 0.5s ease;
        }
        #craftsmanDialog {
            position: absolute;
            right: 20px;
            bottom: 75px;
            width: 340px;
            background: rgba(20, 25, 30, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(196, 165, 116, 0.45);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(196, 165, 116, 0.12);
            border-radius: 8px;
            padding: 20px;
            display: none;
            z-index: 25;
            font-family: "Noto Serif SC", serif;
            cursor: pointer;
        }

        #craftsmanDialog.show {
            display: block;
            animation: dialogFadeIn 0.4s ease;
        }

        @keyframes dialogFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #craftsmanName {
            color: #c4a574;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #craftsmanMessage {
            color: #d8dfdb;
            font-size: 13px;
            line-height: 1.8;
            padding: 12px;
            background: rgba(196, 165, 116, 0.08);
            border-left: 3px solid rgba(196, 165, 116, 0.6);
            border-radius: 4px;
            margin-bottom: 12px;
        }

        #craftsmanTip {
            color: #a49c90;
            font-size: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(196, 165, 116, 0.25);
            font-style: italic;
        }

        #craftsmanDialog.warning {
            border-left: 4px solid #cf5656;
        }

        #craftsmanDialog.warning #craftsmanMessage {
            background: rgba(180, 50, 50, 0.12);
            border-left-color: #cf5656;
            color: #e8b4b4;
        }

        #craftsmanDialog.guide {
            border-left: 4px solid #52c41a;
        }

        #craftsmanDialog.guide #craftsmanMessage {
            background: rgba(82, 196, 26, 0.1);
            border-left-color: #52c41a;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #2d1810 0%, #1a0f0a 100%);
            border-bottom: 2px solid #c9a227;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-brand .logo {
            font-size: 28px;
        }

        .nav-brand .brand-text {
            font-size: 20px;
            font-weight: 600;
            color: #c9a227;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: #a8a090;
            text-decoration: none;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #c9a227;
            background: rgba(201, 162, 39, 0.1);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: #c9a227;
        }
        .navbar {
            display: none !important;
        }

        #game {
            margin-top: 0 !important;
            height: 100vh !important;
        }

        #partsContainer { 
            margin-top: 0 !important;
            padding-top: 0 !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(3px, 0.6vh, 6px);
            max-height: calc(100vh - 40px);
            flex: 1;
            min-height: 0;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #leftPanel {
            overflow-y: hidden;
            justify-content: flex-start !important;
            padding: clamp(8px, 1.2vh, 14px) 10px !important;
            height: 100vh !important;
            box-sizing: border-box !important;
        }

        #leftPanel::-webkit-scrollbar,
        #partsContainer::-webkit-scrollbar { width: 4px; }
        #leftPanel::-webkit-scrollbar-thumb,
        #partsContainer::-webkit-scrollbar-thumb { background: rgba(196, 165, 116, 0.25); border-radius: 4px; }
    
        #leftPanel h2 {
            margin: 0 0 clamp(4px, 0.8vh, 8px) 0 !important;
            padding: 0 !important;
        }

        /* 关卡选择与立体视角控制栏 */
        .level-selector {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 15;
            background: rgba(26, 15, 10, 0.85);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid #5a3d2a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .level-btn {
            background: transparent;
            border: none;
            color: #a8a090;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .level-btn:hover {
            color: #f4ebe0;
        }

        
        .level-btn.locked {
            opacity: 0.55;
            cursor: not-allowed !important;
            filter: grayscale(0.4);
        }
        .level-btn.locked:hover {
            color: #a8a090 !important;
            background: transparent !important;
            box-shadow: none !important;
            transform: none !important;
            border-color: #5a3d2a !important;
        }
        
        .level-btn.active {
            background: rgba(196, 165, 116, 0.22);
            border: 1px solid rgba(196, 165, 116, 0.55);
            color: #f5ede1;
            box-shadow: 0 0 12px rgba(196, 165, 116, 0.25);
        }

        .view-controls {
            position: absolute;
            top: 15px;
            right: 75px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 15;
            background: rgba(18, 22, 28, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(196, 165, 116, 0.35);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        }

        .view-hint {
            color: #c4a574;
            font-size: 11px;
            margin-right: 4px;
            user-select: none;
            opacity: 0.9;
        }

        .view-btn {
            background: rgba(28, 34, 42, 0.85);
            border: 1px solid rgba(196, 165, 116, 0.2);
            color: #d1c1a5;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .view-btn:hover {
            border-color: rgba(196, 165, 116, 0.6);
            color: #f5ede1;
            background: rgba(38, 46, 58, 0.9);
        }

        .view-btn.active {
            background: rgba(196, 165, 116, 0.25);
            color: #f5ede1;
            border-color: rgba(196, 165, 116, 0.6);
            font-weight: 600;
        }

        .btn-primary-gold {
            background: linear-gradient(135deg, #ffd700 0%, #c9a227 100%) !important;
            color: #1a0f0a !important;

                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 3.2, 20), purlinMat);
                mesh.rotation.x = Math.PI / 2;
            } else if (part.type === 'cylinder') {
                const geo = new THREE.CylinderGeometry(part.r, part.r, part.h, 24);
                mesh = new THREE.Mesh(geo, colMat);
            } else if (part.type === 'purlin') {
                const geo = new THREE.CylinderGeometry(part.r, part.r, part.len, 24);
                mesh = new THREE.Mesh(geo, purlinMat);
                mesh.rotation.x = Math.PI / 2;
            } else if (part.type === 'gabled_3d') {
                mesh = createGabledRoof3DMesh(part.w, part.h, part.d);
            } else {
                const geo = new THREE.BoxGeometry(part.w, part.h, part.d);
                mesh = new THREE.Mesh(geo, yellowChuanMat);
            }

            // 深度克隆独立材质，彻底避免各柱子、枋材之间共享材质导致的高光联动串扰
            mesh.traverse(child => {
                if (child.isMesh && child.material) {
                    child.material = child.material.clone();
                }
            });

            return mesh;
        }

        function createGabledRoof3DMesh(w, h, d) {
            const roofGroup = new THREE.Group();
            const slopeLen = Math.hypot(h, w / 2);
            const slopeAngle = Math.atan2(h, w / 2);

            const leftSlopeGeo = new THREE.BoxGeometry(slopeLen, 0.06, d);
            const leftSlope = new THREE.Mesh(leftSlopeGeo, roofMat);
            leftSlope.position.set(-w / 4, h * 0.45, 0);
            leftSlope.rotation.z = slopeAngle;
            leftSlope.castShadow = true;
            leftSlope.receiveShadow = true;
            roofGroup.add(leftSlope);

            const rightSlopeGeo = new THREE.BoxGeometry(slopeLen, 0.06, d);
            const rightSlope = new THREE.Mesh(rightSlopeGeo, roofMat);
            rightSlope.position.set(w / 4, h * 0.45, 0);
            rightSlope.rotation.z = -slopeAngle;
            rightSlope.castShadow = true;
            rightSlope.receiveShadow = true;
            roofGroup.add(rightSlope);

            const ridgeGeo = new THREE.BoxGeometry(0.2, 0.12, d + 0.1);
            const ridge = new THREE.Mesh(ridgeGeo, purlinMat);
            ridge.position.set(0, h * 0.98, 0);
            ridge.castShadow = true;
            ridge.receiveShadow = true;
            roofGroup.add(ridge);

            return roofGroup;
        }

        function createGabledRoof3DZone(w, h, d) {
            const roofGroup = new THREE.Group();
            const roofWireMat = new THREE.MeshBasicMaterial({
                color: 0x5c4d38,
                transparent: true,
                opacity: 0.06
            });

            const slopeLen = Math.hypot(h, w / 2);
            const slopeAngle = Math.atan2(h, w / 2);

            const leftSlopeGeo = new THREE.BoxGeometry(slopeLen * 1.05, 0.1, d * 1.02);
            const leftSlope = new THREE.Mesh(leftSlopeGeo, roofWireMat);
            leftSlope.position.set(-w / 4, h * 0.45, 0);
            leftSlope.rotation.z = slopeAngle;
            roofGroup.add(leftSlope);
            const lineLeft = new THREE.LineSegments(new THREE.EdgesGeometry(leftSlopeGeo), new THREE.LineBasicMaterial({ color: 0x6e5d45, opacity: 0.38, transparent: true }));
            lineLeft.position.set(-w / 4, h * 0.45, 0);
            lineLeft.rotation.z = slopeAngle;
            roofGroup.add(lineLeft);

            const rightSlopeGeo = new THREE.BoxGeometry(slopeLen * 1.05, 0.1, d * 1.02);
            const rightSlope = new THREE.Mesh(rightSlopeGeo, roofWireMat);
            rightSlope.position.set(w / 4, h * 0.45, 0);
            rightSlope.rotation.z = -slopeAngle;
            roofGroup.add(rightSlope);
            const lineRight = new THREE.LineSegments(new THREE.EdgesGeometry(rightSlopeGeo), new THREE.LineBasicMaterial({ color: 0x6e5d45, opacity: 0.38, transparent: true }));
            lineRight.position.set(w / 4, h * 0.45, 0);
            lineRight.rotation.z = -slopeAngle;
            roofGroup.add(lineRight);

            return roofGroup;
        }

                    const zoneMat = new THREE.MeshBasicMaterial({
                        color: 0x5c4d38,
                        transparent: true,
                        opacity: 0.06
                    });
                    zone = new THREE.Mesh(zoneGeo, zoneMat);
                    zone.rotation.x = Math.PI / 2;
                    const edges = new THREE.EdgesGeometry(zoneGeo);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x6e5d45, opacity: 0.38, transparent: true }));
                    zone.add(line);
                } else if (part.type === 'gabled_3d') {
                    zone = createGabledRoof3DZone(part.w, part.h, part.d);
                } else {
                    const zoneW = part.w * 1.06;
                    const zoneH = part.h * 1.6;
                    const zoneD = part.d * 1.6;
                    const zoneGeo = new THREE.BoxGeometry(zoneW, zoneH, zoneD);
                    const zoneMat = new THREE.MeshBasicMaterial({
                        color: 0x5c4d38,
                        transparent: true,
                        opacity: 0.06
                    });
                    zone = new THREE.Mesh(zoneGeo, zoneMat);
                    const edges = new THREE.EdgesGeometry(zoneGeo);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x6e5d45, opacity: 0.38, transparent: true }));
                    zoneGroup.add(line);
                }

                zoneGroup.add(zone);
                zoneGroup.traverse(child => {
                    if (child.material) {
                        child.material = child.material.clone();
                    }
                });
                zoneGroup.userData = { partId: part.id, isZone: true, zoneMesh: zone };
                scene.add(zoneGroup);
                targetZones.push(zoneGroup);
            });
        }

        // 第二关显眼醒目的构件陈列台（解决放的位置不好找问题）
        function createStagingDeck() {
            if (stagingDeckGroup) {
                scene.remove(stagingDeckGroup);
            }
            stagingDeckGroup = new THREE.Group();

            // 宽大古朴木作工匠台底座（置于中央偏右区域 X=5.2，承托第二关14件立体构件）
            const deckGeo = new THREE.BoxGeometry(3.6, 0.08, 6.6);
            const deckMat = new THREE.MeshStandardMaterial({
                color: 0x14181f,
                roughness: 0.8,
                metalness: 0.15
            });
            const deckMesh = new THREE.Mesh(deckGeo, deckMat);
            deckMesh.position.set(5.2, 0.04, 0);
            deckMesh.receiveShadow = true;
            stagingDeckGroup.add(deckMesh);

            // 工匠台四周嵌金饰条边框
            const edgeGeo = new THREE.EdgesGeometry(deckGeo);
            const edgeLine = new THREE.LineSegments(
                edgeGeo,
                new THREE.LineBasicMaterial({ color: 0xc4a574, opacity: 0.65, transparent: true })
            );
            edgeLine.position.set(5.2, 0.04, 0);
            stagingDeckGroup.add(edgeLine);

            // 台面规整网格
            const gridHelper = new THREE.GridHelper(6.0, 8, 0xc4a574, 0x222a36);
            gridHelper.position.set(5.2, 0.082, 0);
            stagingDeckGroup.add(gridHelper);

            scene.add(stagingDeckGroup);
        }

        function createDraggableParts() {
            draggableObjects = [];
            partsData.forEach((part, index) => {
                const mesh = createPartMesh(part);

                let pos;
                if (currentLevel === 2 && part.stagePos) {
                    pos = part.stagePos;
                } else if (part.initPos) {
                    pos = part.initPos;
                } else {
                    pos = positionsLvl1[index % positionsLvl1.length];
                }

                mesh.position.set(pos.x, pos.y, pos.z);
                mesh.visible = true;

                mesh.userData = {
                    partId: part.id,
                    partData: part,
                    isDraggable: true,
                    originalPos: mesh.position.clone()
                };

                scene.add(mesh);
                draggableObjects.push(mesh);
            });
        }

        function initThreeJS() {
            const container = document.querySelector('#construction-mode #scene') || document.getElementById('scene');
            if (!container) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0e13);
            scene.fog = new THREE.Fog(0x0b0e13, 12, 45);

            const width = (container.clientWidth > 0) ? container.clientWidth : (window.innerWidth || 800);
            const height = (container.clientHeight > 0) ? container.clientHeight : (window.innerHeight || 600);

            camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
            camera.position.set(0, 2.3, 8.5);
            camera.lookAt(0, 1.8, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
            sun.position.set(5, 10, 8);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            const fill = new THREE.DirectionalLight(0x6688aa, 0.35);
            fill.position.set(-5, 8, -5);
            scene.add(fill);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x0e1117, roughness: 0.95 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const grid = new THREE.GridHelper(60, 120, 0x2d2417, 0x13171e);
            scene.add(grid);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
        }

        function createUI() {
            const container = document.getElementById('partsContainer');
            container.innerHTML = '';
            partsData.forEach(part => {
                const div = document.createElement('div');
                div.className = 'part-item';
                div.id = 'ui-' + part.id;
                div.textContent = part.name;
                div.draggable = false;
                
                // 点击左侧卡片高亮3D构件
                div.addEventListener('click', () => {
                    const obj = draggableObjects.find(o => o.userData.partId === part.id);
                    if (obj) {
                        // 移除侧边栏其他选中项，当前项高亮
                        container.querySelectorAll('.part-item').forEach(item => item.classList.remove('selected'));
                        div.classList.add('selected');

                        // 重置其他构件发光
                        draggableObjects.forEach(o => {
                            o.traverse(c => {
                                if (c.isMesh && c.material && c.material.emissive) {
                                    c.material.emissive.setHex(0x000000);
                                }

        function setupEvents() {
            const canvas = renderer.domElement;
            const sceneContainer = document.querySelector('#construction-mode #scene') || document.getElementById('scene');
            const gameContainer = document.getElementById('game');

            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd);

            canvas.addEventListener('wheel', onWheel, { passive: false });
            if (sceneContainer) {
                sceneContainer.addEventListener('wheel', onWheel, { passive: false });
            }
            if (gameContainer) {
                gameContainer.addEventListener('wheel', (e) => {
                    if (e.target && e.target.closest && e.target.closest('#partsContainer')) return;
                    onWheel(e);
                }, { passive: false });
            }

            window.addEventListener('resize', onResize);
            document.getElementById('restartBtn').addEventListener('click', restartCurrentLevel);
        }

        // 3D 视角切换器
        function setCameraView(preset) {
            if (rotationAnimId) {
                cancelAnimationFrame(rotationAnimId);
                rotationAnimId = null;
            }
            if (preset === 'perspective') {
                camTheta = 0.75;
                camPhi = Math.PI / 2.7;
                camRadius = 11.5;
                camTarget.set(1.0, 1.8, 0);
            } else if (preset === 'front') {
                camTheta = 0;
                camPhi = Math.PI / 2.05;
                camRadius = 9.5;
            } else if (preset === 'side') {
                camTheta = Math.PI / 2;
                camPhi = Math.PI / 2.1;
                camRadius = 9.5;
            } else if (preset === 'top') {
                camTheta = 0;
                camPhi = 0.2;
                camRadius = 11.0;
            }
            updateCameraFromOrbit();
        }

        function updateCameraFromOrbit() {
            camPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camPhi));
            camera.position.x = camTarget.x + camRadius * Math.sin(camPhi) * Math.sin(camTheta);
            camera.position.y = camTarget.y + camRadius * Math.cos(camPhi);
            camera.position.z = camTarget.z + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
            camera.lookAt(camTarget);
        }

        function onWheel(e) {
            e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();

            if (currentLevel === 1) {
                // 第一关：单榀平面排架视角平滑推拉（缩放建筑模型）
                camera.position.z += e.deltaY * 0.006;
                camera.position.z = Math.max(4.2, Math.min(14.0, camera.position.z));
                camera.lookAt(0, 1.8, 0);
            } else {
                // 第二关：双榀立体空间视角轨道半径平滑缩放
                camRadius += e.deltaY * 0.008;
                camRadius = Math.max(4.5, Math.min(18.0, camRadius));
                updateCameraFromOrbit();
            }
        }

        function getMousePos(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            return {
                x: ((event.clientX - rect.left) / rect.width) * 2 - 1,
                y: -((event.clientY - rect.top) / rect.height) * 2 + 1
            };
        }
// AI辅助生成：Kimi-k2.5, 2026-04-05
        function onMouseDown(event) {
            // 右键或者中键：用于 3D 旋转视角
            if (event.button === 2 || event.button === 1) {
                if (currentLevel === 2) {
                    isOrbiting = true;
                    orbitStart.x = event.clientX;
                    orbitStart.y = event.clientY;
                }
                return;
            }

            const pos = getMousePos(event);
            mouse.set(pos.x, pos.y);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(draggableObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    if (obj.userData.isDraggable) {
                        break;
                    }
                    obj = obj.parent;
                }

                if (obj.userData.isDraggable && !placedParts.includes(obj.userData.partId)) {
                    expandMeshForBuilding(obj, obj.userData.partData);
                    isDragging = true;
                    draggedObject = obj;
                    obj.userData.originalPos = obj.position.clone();

                    const partId = obj.userData.partId;
                    const zone = targetZones.find(z => z.userData.partId === partId);

                    if (currentLevel === 1) {
                        dragPlane.setFromNormalAndCoplanarPoint(
                            new THREE.Vector3(0, 0, 1),
                            obj.position
                        );
                    } else {
                        // 3D 模式下：拖拽平面穿过目标虚线框中心（若未找到则穿过自身），确保光标对准目标时深度完全重合无视差
                        const camDir = new THREE.Vector3();
                        camera.getWorldDirection(camDir);
                        camDir.negate();
                        const planePt = zone ? zone.position : obj.position;
                        dragPlane.setFromNormalAndCoplanarPoint(camDir, planePt);
                    }

                    const intersect = new THREE.Vector3();
                    raycaster.ray.intersectPlane(dragPlane, intersect);
                    dragOffset.subVectors(obj.position, intersect);
                    obj.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.emissive = new THREE.Color(0x2eb82e);
                        }
                    });
                    if (zone && !placedParts.includes(partId)) {
                        zone.traverse(c => {
                            if (c.material) {
                                if (c.isMesh) {
                                    c.material.color.setHex(0x52c41a);
                                    c.material.opacity = 0.35;
                                } else if (c.isLineSegments) {
                                    c.material.color.setHex(0x52c41a);
                                    c.material.opacity = 0.85;
                                }
                            }
                        });
                    }
                    document.getElementById('ui-' + obj.userData.partId).classList.add('dragging');
                    document.getElementById('dragIndicator').style.display = 'block';
                }
            } else if (currentLevel === 2) {
                // 点击空白处，左键也可环绕视角
                isOrbiting = true;
                orbitStart.x = event.clientX;
                orbitStart.y = event.clientY;
            }
        }

        function onMouseMove(event) {
            if (isOrbiting && currentLevel === 2) {
                const deltaX = event.clientX - orbitStart.x;
                const deltaY = event.clientY - orbitStart.y;
                camTheta -= deltaX * 0.006;
                camPhi -= deltaY * 0.006;
                orbitStart.x = event.clientX;
                orbitStart.y = event.clientY;
                updateCameraFromOrbit();
                return;
            }

            if (!isDragging || !draggedObject) return;

            const pos = getMousePos(event);
            mouse.set(pos.x, pos.y);

            raycaster.setFromCamera(mouse, camera);

            const partId = draggedObject.userData.partId;
            const zone = targetZones.find(z => z.userData.partId === partId);

            if (currentLevel === 1) {
                dragPlane.setFromNormalAndCoplanarPoint(
                    new THREE.Vector3(0, 0, 1),
                    draggedObject.position.clone()
                );
            } else {
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.negate();
                const planePt = zone ? zone.position : draggedObject.position;
                dragPlane.setFromNormalAndCoplanarPoint(camDir, planePt);
            }

            const intersect = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(dragPlane, intersect)) {
                let targetPos = intersect.add(dragOffset);
                
                if (zone && !isReturningToOriginal) {
                    const dist3D = targetPos.distanceTo(zone.position);
                    const snapRadius = config.snapDistance * 1.2;

                    // 极其自然的温和渐变微吸阻尼：随距离平滑提升微吸力（最大仅0.22），绝不产生瞬移突兀感
                    if (dist3D < snapRadius) {
                        const pullFactor = Math.pow(1.0 - dist3D / snapRadius, 2) * 0.22;
                        targetPos.lerp(zone.position, pullFactor);
                    }
                }

                draggedObject.position.copy(targetPos);
                if (currentLevel === 1) {
                    draggedObject.position.z = THREE.MathUtils.lerp(draggedObject.position.z, 0, 0.3);
                }
            }

            const indicator = document.getElementById('dragIndicator');
            indicator.style.left = (event.clientX + 15) + 'px';
            indicator.style.top = (event.clientY - 30) + 'px';
            indicator.textContent = draggedObject.userData.partData.name;

            checkSnap();
        }

        function onMouseUp(event) {
            if (isOrbiting) {
                isOrbiting = false;
            }

            if (!isDragging || !draggedObject) return;

            const currentObj = draggedObject;
            isDragging = false; 
            draggedObject = null;
            currentObj.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.emissive = new THREE.Color(0x000000);
                }
            });
            document.getElementById('ui-' + currentObj.userData.partId).classList.remove('dragging');
            document.getElementById('dragIndicator').style.display = 'none';
            const result = checkPlacement(currentObj);

            if (result === 'success') {
                placePart(currentObj);
            } else if (result === 'order_error') {
                returnToOriginal(currentObj, () => {});
            } else {
                showError(currentObj);
                returnToOriginal(currentObj, () => {});
            }
        }

        function onTouchStart(event) {
            if (event.touches.length === 1) {
                const touch = event.touches[0];
                onMouseDown({ clientX: touch.clientX, clientY: touch.clientY, button: 0 });
            }
        }

        function onTouchMove(event) {
            if (event.touches.length === 1) {
                const touch = event.touches[0];
                onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
            }
        }

        function onTouchEnd(event) {
            onMouseUp({});
        }

        function checkSnap() {
            if (!draggedObject || isReturningToOriginal) return;

            const partId = draggedObject.userData.partId;
            const zone = targetZones.find(z => z.userData.partId === partId);

            if (zone) {
                const dist = draggedObject.position.distanceTo(zone.position);
                const snapThreshold = config.snapDistance * 1.15;
                let isNear = (dist < snapThreshold);

                if (currentLevel === 2) {
                    const objScreen = draggedObject.position.clone().project(camera);
                    const zoneScreen = zone.position.clone().project(camera);
                    const screenDist = Math.hypot(objScreen.x - zoneScreen.x, objScreen.y - zoneScreen.y);
                    if (screenDist < 0.14) isNear = true;
                }

                if (isNear) {
                    zone.traverse((child) => {
                        if (child.material) {
                            if (child.isMesh) {
                                child.material.opacity = 0.4;
                                child.material.color.setHex(0x4caf50);
                            }
                            if (child.isLineSegments) {
                                child.material.opacity = 0.9;
                                child.material.color.setHex(0x4caf50);
                            }
                        }
                    });
                } else {
                    zone.traverse((child) => {
                        if (child.material) {
                            if (child.isMesh) {
                                child.material.opacity = 0.06;
                                child.material.color.setHex(0x5c4d38);
                            }
                            if (child.isLineSegments) {
                                child.material.opacity = 0.65;
                                child.material.color.setHex(0x5c4d38);
                            }
                        }
                    });
                }
            }
        }

        function checkPlacement(obj) {
            if (!obj) return false;

            const partData = obj.userData.partData;
            expandMeshForBuilding(obj, partData);
            const zone = targetZones.find(z => z.userData.partId === partData.id);

            if (!zone) return false;

            if (partData.order) {
                const currentOrder = partData.order;
                const unplacedPrecursors = partsData.filter(p => p.order < currentOrder && !placedParts.includes(p.id));

                if (unplacedPrecursors.length > 0) {
                    const minMissingOrder = Math.min(...unplacedPrecursors.map(p => p.order));
                    showOrderError(partData, currentOrder, minMissingOrder);
                    return 'order_error';
                }
            }

            const dist3D = obj.position.distanceTo(zone.position);
            const snapThreshold = config.snapDistance * 1.25;
            let isNearSuccess = (dist3D < snapThreshold);

            if (currentLevel === 2) {
                const objScreen = obj.position.clone().project(camera);
                const zoneScreen = zone.position.clone().project(camera);
                const screenDist = Math.hypot(objScreen.x - zoneScreen.x, objScreen.y - zoneScreen.y);
                if (screenDist < 0.15) isNearSuccess = true;
            }

            if (isNearSuccess) {
                return 'success';
            } else {
                return 'position_error';
            }
        }

        function placePart(obj) {
            const partData = obj.userData.partData;
            expandMeshForBuilding(obj, partData);
            const targetPos = new THREE.Vector3(partData.x, partData.y, partData.z);
            const startPos = obj.position.clone();

            if (!placedParts.includes(partData.id)) {
                placedParts.push(partData.id);
            }
            const progressNum = placedParts.length;
            document.getElementById('progressNum').textContent = progressNum;
            document.getElementById('progressFill').style.width = (progressNum / partsData.length * 100) + '%';

            const duration = 600; 
            const startTime = Date.now();

            function animatePlace() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 4); 

                obj.position.lerpVectors(startPos, targetPos, eased);

                if (progress < 1) {
                    requestAnimationFrame(animatePlace);
                } else {
                    draggableObjects = draggableObjects.filter(o => o !== obj);

                    document.getElementById('ui-' + partData.id).classList.add('placed');

                    const zone = targetZones.find(z => z.userData.partId === partData.id);
                    if (zone) zone.visible = false;

                    showBook(partData.success, true);

                    if (placedParts.length >= partsData.length) {
                        saveGameRecord(); 
                        setTimeout(() => {
                            if (currentLevel === 1) {
                                level1Completed = true;
                                try { localStorage.setItem('chuandou_level1_completed', 'true'); } catch(e){}
                                updateLevelSelectorUI();
                                showLevel1Complete();
                            } else {
                                level2Completed = true;
                                showLevel2Complete();
                            }
                        }, 800);
                    }
                }
            }

            animatePlace();
        }

                setTimeout(() => {
                    dialog.classList.remove('show');
                }, 4000);
            }
        }

        function updateLevelSelectorUI() {
            const tab2 = document.getElementById('levelBtn2');
            if (!tab2) return;
            const badge = tab2.querySelector('.level-badge');
            if (level1Completed) {
                tab2.classList.remove('locked');
                tab2.removeAttribute('title');
                if (badge) {
                    badge.textContent = '双榀立体';
                } else {
                    tab2.innerHTML = '第 2 关 · 立体营造';
                }
            } else {
                tab2.classList.add('locked');
                tab2.setAttribute('title', '通关第一关后解锁');
                if (badge) {
                    badge.textContent = '🔒 未解锁';
                } else {
                    tab2.innerHTML = '<span class="lock-icon" style="opacity:0.75; margin-right:3px;">🔒</span>第 2 关 · 立体营造';
                }
            }
        }

        function switchToLevel(lvl) {
            if (lvl === 2 && !level1Completed) {
                showLockedLevelNotice();
                return;
            }
            currentLevel = lvl;

            if (rotationAnimId) {
                cancelAnimationFrame(rotationAnimId);
                rotationAnimId = null;
            }

            // 更新顶部切换栏与徽章
            const levelSelector = document.getElementById('levelSelector');
            const levelBadge = document.getElementById('levelBadge');
            const viewControls = document.getElementById('viewControls');
            const tab1 = document.getElementById('levelBtn1');
            const tab2 = document.getElementById('levelBtn2');

            if (lvl === 1) {
                tab1.classList.add('active');
                tab2.classList.remove('active');
                levelBadge.textContent = '第一关：单榀排架 · 平面基础';
                viewControls.style.display = 'none';
                partsData = level1PartsData;
            } else {
                tab1.classList.remove('active');
                tab2.classList.add('active');
                levelBadge.textContent = '第二关：双榀立体 · 空间营造';
                viewControls.style.display = 'flex';
                partsData = level2PartsData;
            }

            restartCurrentLevel();
        }

        function restartCurrentLevel() {
            placedParts = [];
            isDragging = false;
            draggedObject = null;
            errorCount = {};

            if (rotationAnimId) {
                cancelAnimationFrame(rotationAnimId);
                rotationAnimId = null;
            }

            const partsToRemove = [];
            scene.traverse(child => {
                if (child.userData && child.userData.partId && !child.userData.isZone) {
                    partsToRemove.push(child);
                }
            });
            partsToRemove.forEach(obj => {
                if (obj.parent) obj.parent.remove(obj);
                else scene.remove(obj);
            });
            draggableObjects = [];

            if (builtGroup) {
                scene.remove(builtGroup);
                builtGroup = null;
            }

            targetZones.forEach(z => {
                scene.remove(z);
            });
            targetZones = [];

            if (currentLevel === 2) {
                createStagingDeck();
                setCameraView('perspective');
            } else {
                if (stagingDeckGroup) {
                    scene.remove(stagingDeckGroup);
                    stagingDeckGroup = null;
                }
                camera.position.set(0, 2.3, 8.5);
                camera.lookAt(0, 1.8, 0);
                camTarget.set(0, 1.8, 0);
            }

            createTargetZones();
            createDraggableParts();
            createUI();

            document.getElementById('complete').classList.remove('show');
            document.getElementById('book').classList.remove('show');

            gameStartTime = Date.now();
            showCraftsmanWelcome();
        }

        function startRotation() {
            let angle = camTheta;
            function rotate() {
                angle += 0.005;
                camera.position.x = camTarget.x + camRadius * Math.sin(camPhi) * Math.sin(angle);
                camera.position.y = camTarget.y + camRadius * Math.cos(camPhi);
                camera.position.z = camTarget.z + camRadius * Math.sin(camPhi) * Math.cos(angle);
                camera.lookAt(camTarget);
                rotationAnimId = requestAnimationFrame(rotate);
            }
            rotate();
        }

        function returnToOriginal(obj, callback) {
            isReturningToOriginal = true;
            targetZones.forEach(zone => {
                zone.traverse((child) => {
                    if (child.material) {
                        if (child.isMesh) {
                            child.material.opacity = 0.06;
                            child.material.color.setHex(0x5c4d38);
                        }
                        if (child.isLineSegments) {
                            child.material.opacity = 0.65;
                            child.material.color.setHex(0x5c4d38);
                        }
                    }
                });
            });

            const originalPos = obj.userData.originalPos;
            const startPos = obj.position.clone();
            const duration = 400;
            const startTime = Date.now();

            function animateReturn() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                obj.position.lerpVectors(startPos, originalPos, progress);

                if (progress < 1) {
                    requestAnimationFrame(animateReturn);
                } else {
                    isReturningToOriginal = false;
                    if (callback) callback();
                }
            }

            animateReturn();
        }

        function showBook(content, isSuccess) {
            const book = document.getElementById('book');
            book.className = 'show ' + (isSuccess ? 'success' : 'error');
            document.getElementById('bookTitle').textContent = isSuccess ? '✓ 放置正确' : '✗ 放置错误';
            document.getElementById('bookQuote').textContent = content.quote;
            document.getElementById('bookSource').textContent = content.source;
            document.getElementById('bookExp').textContent = content.exp;

            setTimeout(() => {
                book.classList.remove('show');
            }, 3500);
        }

        function saveGameRecord() {
            const completionTime = (Date.now() - gameStartTime) / 1000;
            const totalErrors = Object.values(errorCount).reduce((a, b) => a + b, 0);
            
            const token = localStorage.getItem('chuandou_token');
            if (token) {
                fetch('/api/game/records', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        completion_time: completionTime,
                        error_count: totalErrors,
                        is_completed: true,
                        level: currentLevel
                    })
                }).catch(err => {
                    console.warn('保存成绩失败:', err);
                });
            }
        }

        function onResize() {
            const container = document.getElementById('scene');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function closeHelp() {
            document.getElementById('helpModal').classList.remove('show');
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
